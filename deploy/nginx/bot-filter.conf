# Bot and scanner filtering — maps User-Agent to a block flag.
# Place at /etc/nginx/conf.d/bot-filter.conf (http context).

map $http_user_agent $bad_bot {
    default 0;

    # Vulnerability scanners
    ~*nikto       1;
    ~*sqlmap       1;
    ~*nmap         1;
    ~*masscan      1;
    ~*zgrab        1;
    ~*nuclei       1;
    ~*gobuster     1;
    ~*dirbuster    1;

    # CMS scanners
    ~*wpscan       1;

    # SEO/scraper bots
    ~*semrush      1;
    ~*ahref        1;
    ~*mj12bot      1;
    ~*dotbot       1;
    ~*petalbot     1;
    ~*bytespider   1;
    ~*gptbot       1;
    ~*ccbot        1;

    # Script libraries
    ~*libwww-perl  1;
    ~*mechanize    1;
    ~*scrapy       1;
}
