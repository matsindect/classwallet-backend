# Rate limiting zones — include in http {} context
# Place this file at /etc/nginx/conf.d/rate-limit.conf

# General API: 30 req/s per IP, 10MB shared memory
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Auth endpoints: 5 req/s per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;
